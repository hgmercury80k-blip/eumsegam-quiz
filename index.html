<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>음세감 청음 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 청음 노트와 같은 팔레트·서체. 한 화면에 한 단계(설정 → 듣기·답하기 → 결과). */
:root{
  --paper:#F1F1F4; --surface:#FCFCFE; --surface-2:#E9E9EE;
  --ink:#16161C; --ink-2:#54545F; --ink-3:#85858F;
  --line:#DBDBE2; --line-2:#C7C7D1;
  --brass:#8A6013; --brass-ink:#5E4108; --brass-bg:#EFE6D2;
  --ok:#2A6B46; --ok-bg:#DFEDE4; --ng:#9A3030; --ng-bg:#F2DFDF;
  --e-baroque:#1F6B5E; --e-classical:#2F5AA0; --e-romantic:#9E3355; --e-modern:#63469A;
  --serif:"Gowun Batang","Apple SD Gothic Neo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,20,30,.06),0 6px 18px -10px rgba(20,20,30,.22);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#111116; --surface:#1A1A20; --surface-2:#24242C;
  --ink:#EDEDF2; --ink-2:#A3A3AF; --ink-3:#76767F;
  --line:#2B2B34; --line-2:#3A3A45;
  --brass:#D9A441; --brass-ink:#EFC978; --brass-bg:#332811;
  --ok:#6FCB96; --ok-bg:#16301F; --ng:#E88585; --ng-bg:#361A1A;
  --e-baroque:#4CBCA5; --e-classical:#82A9E8; --e-romantic:#E8829D; --e-modern:#AC91E4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
h1,h2{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:620px;margin:0 auto;padding-block:28px 64px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1{font-size:28px;line-height:1.25;margin-top:4px}
.lede{color:var(--ink-2);font-size:14px;margin:8px 0 22px}

.era-b{--era:var(--e-baroque)} .era-c{--era:var(--e-classical)} .era-r{--era:var(--e-romantic)} .era-m{--era:var(--e-modern)}

/* setup */
.eras{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.eraBtn{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--era);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.eraBtn .nm{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--era)}
.eraBtn .rg{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.eraBtn[aria-pressed="false"]{opacity:.45;border-left-color:var(--line-2)}
.eraBtn[aria-pressed="false"] .nm{color:var(--ink-3)}
.opts{display:flex;flex-direction:column;gap:8px;margin:18px 0 20px;font-size:13.5px;color:var(--ink-2)}
.opts label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.opts input{margin-top:4px;accent-color:var(--brass)}
.opts b{color:var(--ink);font-weight:600}
.primary{width:100%;padding:14px;border-radius:9px;border:0;background:var(--ink);color:var(--paper);font-weight:600;font-size:15px}
.primary:disabled{opacity:.4;cursor:default}
.notice{margin-top:16px;font-size:12.5px;color:var(--brass-ink);background:var(--brass-bg);border-radius:7px;padding:9px 12px}

/* play */
.top{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.top .era{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--era)}
.top .pos{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.top .score{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.top .score b{color:var(--ink)}
.track{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:16px}
.track i{display:block;height:100%;background:var(--era);transition:width .3s}

.stage{position:relative;border-radius:11px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
/* 영상 화면에 제목이 뜨므로 플레이어는 뒤에 숨기고 덮개를 씌운다 */
.playerBox{position:absolute;inset:0;opacity:.001;pointer-events:none}
.playerBox iframe,.playerBox>div{width:100%;height:100%}
.cover{position:relative;padding:22px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:190px}
.clock{font-family:var(--mono);font-size:42px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.clock small{font-size:14px;color:var(--ink-3);margin-left:4px}
.bars{display:flex;gap:3px;align-items:flex-end;height:28px}
.bars span{width:4px;border-radius:2px;background:var(--era);height:20%;transition:height .25s}
.playing .bars span{animation:b 1s ease-in-out infinite alternate}
.bars span:nth-child(2n){animation-delay:-.3s}.bars span:nth-child(3n){animation-delay:-.6s}.bars span:nth-child(5n){animation-delay:-.15s}
@keyframes b{from{height:15%}to{height:100%}}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-align:center}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ghost{background:var(--surface);border:1px solid var(--line-2);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--ink-2)}
.err{font-size:12.5px;color:var(--ng);text-align:center}
.err a{color:var(--ng)}

.answer{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.field input{padding:11px 13px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:15px;min-width:0}
.field input.ok{border-color:var(--ok);background:var(--ok-bg)}
.field input.ng{border-color:var(--ng);background:var(--ng-bg)}
.row2{display:flex;gap:8px}
.row2 button{flex:1;padding:12px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid var(--line-2);background:var(--surface)}
.row2 .go{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.reveal{margin-top:14px;padding:15px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--era)}
.verdict{font-family:var(--mono);font-size:12px;display:flex;gap:14px;margin-bottom:8px}
.verdict .y{color:var(--ok)} .verdict .n{color:var(--ng)}
.reveal .ans{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.4}
.reveal .sub{font-size:13px;color:var(--ink-2);margin-top:3px}
.reveal .num{font-family:var(--mono);font-size:12px;color:var(--era);margin-right:6px}
.reveal a{font-family:var(--mono);font-size:12px;color:var(--brass-ink)}

/* result */
.sumGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0}
.sumCell{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--era);border-radius:8px;padding:10px 12px}
.sumCell .nm{font-size:12.5px;color:var(--ink-2)}
.sumCell .v{font-family:var(--mono);font-size:20px;font-weight:600}
.sumCell .v small{font-size:12px;color:var(--ink-3);font-weight:400}
.missList{list-style:none;margin:0 0 20px;padding:0;border-top:1px solid var(--line)}
.missList li{padding:9px 0 9px 12px;border-bottom:1px solid var(--line);border-left:3px solid var(--era);font-size:13.5px}
.missList .what{font-family:var(--mono);font-size:11px;color:var(--ng);margin-left:6px}
.btnCol{display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div class="wrap">

<!-- 1. 설정 -->
<section id="setup">
  <div class="eyebrow">음악세계와 감상 · 감상 리스트 44곡</div>
  <h1>청음 퀴즈</h1>
  <p class="lede">고른 시대의 곡을 무작위 순서로 틀어 줍니다. 각 곡은 처음~2분 사이 아무 지점에서 시작해 1분 동안 나오고, 듣고 나서 작곡가와 곡 제목을 적으면 채점합니다.</p>
  <div class="eras" id="eraPick"></div>
  <div class="opts">
    <label><input type="checkbox" id="optOrder" checked> <span><b>시대순으로 진행</b> — 바로크 곡을 모두 듣고 고전으로 넘어갑니다. 시대 안에서는 순서가 무작위입니다. 끄면 시대 구분 없이 모두 섞습니다.</span></label>
    <label><input type="checkbox" id="optHint" checked> <span><b>입력 자동완성</b> — 타이핑하면 44곡 목록에서 후보를 띄웁니다. 끄면 기억만으로 적어야 합니다.</span></label>
  </div>
  <button class="primary" id="startBtn" type="button">시작</button>
  <div class="notice" id="badNote" hidden></div>
</section>

<!-- 2. 듣기 + 답하기 -->
<section id="play" hidden>
  <div class="top"><span class="era" id="pEra"></span><span class="pos" id="pPos"></span><span class="score" id="pScore"></span></div>
  <div class="track"><i id="pTrack"></i></div>
  <div class="stage">
    <div class="playerBox"><div id="player"></div></div>
    <div class="cover" id="cover">
      <div class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="clock" id="clock">0:60<small>남음</small></div>
      <div class="meta" id="pMeta">불러오는 중…</div>
      <div class="ctrl">
        <button class="ghost" id="pauseBtn" type="button">일시정지</button>
        <button class="ghost" id="replayBtn" type="button">같은 구간 다시</button>
        <button class="ghost" id="stopBtn" type="button">그만 듣고 답하기</button>
      </div>
      <div class="err" id="pErr" hidden></div>
    </div>
  </div>

  <form class="answer" id="ansForm" autocomplete="off">
    <div class="field"><label for="inComp">작곡가</label><input id="inComp" list="dlComp" placeholder="e.g. Bach"></div>
    <div class="field"><label for="inTitle">곡 제목</label><input id="inTitle" list="dlTitle" placeholder="e.g. Toccata and Fugue in D minor"></div>
    <div class="row2" id="ansBtns">
      <button type="button" id="giveUp">모르겠음</button>
      <button type="submit" class="go">채점</button>
    </div>
  </form>
  <datalist id="dlComp"></datalist>
  <datalist id="dlTitle"></datalist>

  <div class="reveal" id="reveal" hidden></div>
  <div class="row2" id="nextBtns" hidden style="margin-top:12px">
    <button type="button" id="quitBtn">여기서 끝내기</button>
    <button type="button" class="go" id="nextBtn">다음 곡</button>
  </div>
</section>

<!-- 3. 결과 -->
<section id="result" hidden>
  <div class="eyebrow">결과</div>
  <h1 id="rHead"></h1>
  <div class="sumGrid" id="rGrid"></div>
  <div id="rMissWrap"></div>
  <div class="btnCol">
    <button class="primary" id="retryMiss" type="button">틀린 곡만 다시</button>
    <button class="ghost" id="backSetup" type="button">처음으로</button>
  </div>
</section>

</div>

{n:43,e:"modern",c:"Jenkins",ck:"젠킨스",kt:"팔라디오 1악장",t:"Palladio: Allegretto",k:["팔라디오","palladio"],v:"f6pOLBqthd4"},
{n:44,e:"modern",c:"Kapustin",ck:"카푸스틴",kt:"8개의 연주회용 연습곡 6번 '파스토랄'",t:'Concert Etude Op. 40 No. 6 "Pastoral"',k:["파스토랄","pastoral","연주회용연습곡","concertetude"],v:"_oDIN-tCqzY"}
];
const COMP_ALIAS = {"Mozart":["모짜르트"],"Bach":["바하"],"Debussy":["드비시"],"Chopin":["쇼팡"],"Puccini":["뿌치니"],"Paganini":["빠가니니"],"Saint-Saëns":["생상","saintsaens"],"Tchaikovsky":["차이코프스키","차이코프스키","차이콥스키"],"Khachaturian":["하차투리얀","카차투리안"],"Shostakovich":["쇼스타코비치"],"Schoenberg":["쇤베르그","쇤베르크","schonberg"],"Piazzolla":["피아솔라","피아졸라"],"Couperin":["쿠프랭","쿠페랭"],"Handel":["헨델","handel","haendel"],"Pachelbel":["파헬벨","파헤벨"],"Gershwin":["거쉰","거슈인"],"Bolling":["볼링","볼링"],"Kapustin":["카푸스틴"],"Mendelssohn":["멘델스존","멘델손"]};

const $ = id => document.getElementById(id);
const eraOf = k => ERAS.find(e => e.k === k);
// 띄어쓰기·문장부호·악센트를 지우고 소문자로 맞춰 비교한다.
// NFKD는 한글을 자모로 쪼개므로 악센트만 지운 뒤 NFC로 다시 합친다.
const norm = s => String(s||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").normalize("NFC").toLowerCase().replace(/[^0-9a-z가-힣]/g,"");

let picked = new Set(ERAS.map(e => e.k));
let queue = [], idx = 0, results = [], cur = null;
let vidIdx = 0;
const curVid = () => [cur.v, ...(cur.alt || [])][vidIdx];
let player = null, ytReady = false, startAt = 0, played = 0, lastTick = 0, isPlaying = false, clipDone = false, fixedStart = false, graded = false;

function store(key, val){ try{ if(val === undefined) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key, JSON.stringify(val)); }catch(e){ return null; } }

/* ---------- 설정 화면 ---------- */
function renderEraPick(){
  const box = $("eraPick"); box.innerHTML = "";
  ERAS.forEach(e => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "eraBtn " + e.cls;
    b.setAttribute("aria-pressed", picked.has(e.k));
    b.innerHTML = `<span class="nm">${e.n}</span><span class="rg">${e.rg}</span>`;
    b.onclick = () => { picked.has(e.k) ? picked.delete(e.k) : picked.add(e.k); store("lq-eras", [...picked]); renderEraPick(); };
    box.appendChild(b);
  });
  $("startBtn").disabled = picked.size === 0;
  const n = SONGS.filter(s => picked.has(s.e) && s.v).length;
  $("startBtn").textContent = picked.size ? `${n}곡 시작` : "시대를 하나 이상 고르세요";
}
const bad = SONGS.filter(s => s.bad);
if(bad.length){ $("badNote").hidden = false; $("badNote").textContent = "빠진 곡: " + bad.map(s => `${s.n}번 ${s.ck} (${s.bad})`).join(", ") + ". 올바른 링크를 넣으면 다시 포함됩니다."; }

function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function begin(list){
  const byEra = $("optOrder").checked;
  const pool = list.filter(s => s.v);
  queue = byEra ? ERAS.flatMap(e => shuffle(pool.filter(s => s.e === e.k))) : shuffle(pool.slice());
  idx = 0; results = [];
  fillDatalists();
  show("play");
  loadSong();
}
$("startBtn").onclick = () => begin(SONGS.filter(s => picked.has(s.e)));

function fillDatalists(){
  const on = $("optHint").checked;
  $("inComp").setAttribute("list", on ? "dlComp" : "");
  $("inTitle").setAttribute("list", on ? "dlTitle" : "");
  const comps = [...new Map(SONGS.map(s => [s.c, s])).values()];
  $("dlComp").innerHTML = comps.map(s => `<option value="${s.c}">`).join("");
  $("dlTitle").innerHTML = SONGS.map(s => `<option value="${s.t.replace(/"/g,"&quot;")}">`).join("");
}

function show(id){ ["setup","play","result"].forEach(s => $(s).hidden = s !== id); window.scrollTo(0, 0); }

/* ---------- 플레이어 ---------- */
window.onYouTubeIframeAPIReady = () => { ytReady = true; if(cur && !player) makePlayer(); };
(function(){ const t = document.createElement("script"); t.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(t); })();

function makePlayer(){
  player = new YT.Player("player", {
    width: 320, height: 180, videoId: cur.v,
    playerVars: {start: Math.floor(startAt), autoplay: 1, controls: 0, disablekb: 1, modestbranding: 1, rel: 0, playsinline: 1},
    events: {
      onReady: e => e.target.playVideo(),
      onStateChange: onState,
      onError: e => showErr(e.data)
    }
  });
}

function loadSong(){
  cur = queue[idx];
  const era = eraOf(cur.e);
  document.body.className = era.cls;
  $("pEra").textContent = era.n;
  $("pPos").textContent = `${idx + 1} / ${queue.length}`;
  const sc = results.filter(r => r.c && r.t).length;
  $("pScore").innerHTML = results.length ? `완벽 <b>${sc}</b> / ${results.length}` : "";
  $("pTrack").style.width = (idx / queue.length * 100) + "%";
  startAt = (cur.s || 0) + Math.random() * WINDOW;
  played = 0; clipDone = false; fixedStart = false; graded = false; vidIdx = 0;
  $("pErr").hidden = true;
  $("inComp").value = ""; $("inTitle").value = "";
  $("inComp").className = ""; $("inTitle").className = "";
  $("inComp").disabled = $("inTitle").disabled = false;
  $("ansBtns").hidden = false; $("reveal").hidden = true; $("nextBtns").hidden = true;
  $("pMeta").textContent = "불러오는 중…";
  setClock();
  if(!ytReady) return;
  if(!player) makePlayer();
  else player.loadVideoById({videoId: cur.v, startSeconds: startAt});
}

function onState(e){
  if(e.data === YT.PlayerState.PLAYING){
    // 영상이 짧으면 끝나기 1분 전으로 당겨서 항상 1분을 채운다
    if(!fixedStart){
      fixedStart = true;
      const d = player.getDuration();
      if(d && startAt > d - CLIP){ startAt = Math.max(0, d - CLIP); player.seekTo(startAt, true); }
    }
    if(clipDone && !graded){ player.pauseVideo(); return; }
    isPlaying = true; lastTick = performance.now();
    $("cover").classList.add("playing");
    $("pauseBtn").textContent = "일시정지";
    $("pMeta").textContent = `${fmt(startAt)} 지점부터 재생 중`;
  }else{
    if(isPlaying) tick();
    isPlaying = false;
    $("cover").classList.remove("playing");
    if(e.data === YT.PlayerState.PAUSED) $("pauseBtn").textContent = "계속 듣기";
    if(e.data === YT.PlayerState.ENDED) finishClip();
  }
}

function tick(){
  if(!isPlaying) return;
  const now = performance.now();
  played += (now - lastTick) / 1000; lastTick = now;
  setClock();
  if(played >= CLIP && !clipDone) finishClip();
}
setInterval(tick, 200);

function finishClip(){
  clipDone = true; isPlaying = false;
  if(player && player.pauseVideo) player.pauseVideo();
  $("cover").classList.remove("playing");
  $("pMeta").textContent = "1분 끝 — 작곡가와 제목을 적어 보세요";
  $("pauseBtn").textContent = "계속 듣기";
  played = Math.max(played, CLIP); setClock();
  if(!graded && document.activeElement !== $("inTitle")) $("inComp").focus();
}

function setClock(){
  const left = Math.max(0, Math.ceil(CLIP - played));
  $("clock").innerHTML = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}<small>남음</small>`;
}
const fmt = s => `${Math.floor(s / 60)}분 ${String(Math.floor(s % 60)).padStart(2, "0")}초`;

function showErr(code){
  if(vidIdx + 1 < [cur.v, ...(cur.alt || [])].length){
    vidIdx++; fixedStart = false; startAt = Math.random() * WINDOW;
    player.loadVideoById({videoId: curVid(), startSeconds: startAt});
    return;
  }
  const url = `https://www.youtube.com/watch?v=${curVid()}&t=${Math.floor(startAt)}`;
  $("pErr").hidden = false;
  $("pErr").innerHTML = `이 영상은 여기서 재생할 수 없습니다 (오류 ${code}). <a href="${url}" target="_blank" rel="noopener">유튜브에서 ${fmt(startAt)}부터 듣기</a> — 정답은 아래에서 맞히면 됩니다.`;
  $("pMeta").textContent = "재생 실패";
}

$("pauseBtn").onclick = () => {
  if(!player) return;
  if(isPlaying) player.pauseVideo();
  else{ if(clipDone) clipDone = false, played = Math.min(played, CLIP - 15); player.playVideo(); }
};
$("replayBtn").onclick = () => {
  if(!player) return;
  played = 0; clipDone = false; setClock();
  player.seekTo(startAt, true); player.playVideo();
};
$("stopBtn").onclick = () => finishClip();

/* ---------- 채점 ---------- */
function compOk(inp, s){
  const x = norm(inp); if(x.length < 2) return false;
  const names = [s.c, s.ck, ...(COMP_ALIAS[s.c] || [])].map(norm);
  return names.some(nm => x.includes(nm) || (x.length >= 3 && nm.includes(x)));
}
function titleOk(inp, s){
  const x = norm(inp); if(x.length < 2) return false;
  if(x === norm(s.kt) || x === norm(s.t)) return true;
  return s.k.map(norm).some(k => x.includes(k));
}

function grade(gaveUp){
  if(graded) return;
  graded = true;
  const c = !gaveUp && compOk($("inComp").value, cur);
  const t = !gaveUp && titleOk($("inTitle").value, cur);
  results.push({s: cur, c, t});
  $("inComp").className = c ? "ok" : "ng";
  $("inTitle").className = t ? "ok" : "ng";
  $("inComp").disabled = $("inTitle").disabled = true;
  $("ansBtns").hidden = true;
  const era = eraOf(cur.e);
  $("reveal").hidden = false;
  $("reveal").innerHTML =
    `<div class="verdict"><span class="${c ? "y" : "n"}">작곡가 ${c ? "맞음" : "틀림"}</span><span class="${t ? "y" : "n"}">제목 ${t ? "맞음" : "틀림"}</span></div>
     <div class="ans"><span class="num">${cur.n}번</span>${cur.ck} — ${cur.kt}</div>
     <div class="sub">${cur.c} · ${cur.t} · ${era.n}</div>
     <div class="sub"><a href="https://www.youtube.com/watch?v=${curVid()}&t=${Math.floor(startAt)}" target="_blank" rel="noopener">방금 구간 유튜브에서 열기 (${fmt(startAt)})</a></div>`;
  $("nextBtns").hidden = false;
  $("nextBtn").textContent = idx + 1 < queue.length ? "다음 곡" : "결과 보기";
  $("nextBtn").focus();
}
$("ansForm").onsubmit = e => { e.preventDefault(); grade(false); };
$("giveUp").onclick = () => grade(true);
$("inComp").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); $("inTitle").focus(); } });

function next(){
  if(player && player.pauseVideo) player.pauseVideo();
  idx++;
  if(idx < queue.length) loadSong(); else finish();
}
$("nextBtn").onclick = next;
$("quitBtn").onclick = finish;

/* ---------- 결과 ---------- */
function finish(){
  if(player && player.pauseVideo) player.pauseVideo();
  document.body.className = "";
  const full = results.filter(r => r.c && r.t).length;
  $("rHead").textContent = `${results.length}곡 중 ${full}곡 완벽`;
  $("rGrid").innerHTML = ERAS.map(e => {
    const rs = results.filter(r => r.s.e === e.k);
    if(!rs.length) return "";
    const ok = rs.filter(r => r.c && r.t).length;
    return `<div class="sumCell ${e.cls}"><div class="nm">${e.n}</div><div class="v">${ok}<small> / ${rs.length}</small></div></div>`;
  }).join("");
  const miss = results.filter(r => !(r.c && r.t));
  $("rMissWrap").innerHTML = miss.length
    ? `<h2 style="font-size:17px;margin-bottom:8px">다시 볼 곡</h2><ul class="missList">` + miss.map(r =>
        `<li class="${eraOf(r.s.e).cls}">${r.s.n}번 ${r.s.ck} — ${r.s.kt}<span class="what">${!r.c && !r.t ? "둘 다" : !r.c ? "작곡가" : "제목"}</span></li>`).join("") + `</ul>`
    : `<p class="lede">모두 맞혔습니다.</p>`;
  $("retryMiss").hidden = !miss.length;
  $("retryMiss").onclick = () => begin(miss.map(r => r.s));
  show("result");
}
$("backSetup").onclick = () => { renderEraPick(); show("setup"); };

/* ---------- 시작 ---------- */
const savedEras = store("lq-eras");
if(Array.isArray(savedEras) && savedEras.length) picked = new Set(savedEras);
renderEraPick();
</script>
</body>
